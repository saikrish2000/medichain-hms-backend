services:
  - type: web
    name: medichain-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: medichain-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: medichain-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: medichain-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: medichain-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: medichain-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://medichain-frontend.onrender.com
      - key: MAIL_USERNAME
        value: ""
      - key: MAIL_PASSWORD
        value: ""
      - key: RAZORPAY_KEY_ID
        value: ""
      - key: RAZORPAY_KEY_SECRET
        value: ""
      - key: TWILIO_ACCOUNT_SID
        value: ""
      - key: TWILIO_AUTH_TOKEN
        value: ""
      - key: TWILIO_PHONE_NUMBER
        value: ""

databases:
  - name: medichain-db
    databaseName: hospital_db
    plan: free

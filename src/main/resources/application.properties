# ── Server ──────────────────────────────────────────────────
spring.application.name=hospital-management-system
server.port=${PORT:8080}
server.error.include-message=always

# ── Database ─────────────────────────────────────────────────
# Defaults to MySQL for local dev. On Render, set SPRING_DATASOURCE_URL to PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true}
spring.datasource.username=${DB_USERNAME:medichain}
spring.datasource.password=${DB_PASSWORD:Medichain@123}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ── HikariCP Connection Pool (tuned for Render free tier) ───
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000

# ── JPA / Hibernate (auto-creates/updates tables) ─────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── Flyway DISABLED — using Hibernate ddl-auto instead ────────
spring.flyway.enabled=false

# ── Schema init ───────────────────────────────────────────────
spring.sql.init.mode=never

# ── JWT ───────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:MediChainHMS2025SuperSecretKey256BitsLongPleaseChange}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# ── CORS ──────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Mail ──────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@medichain.com}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ── Razorpay ──────────────────────────────────────────────────
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# ── Twilio ────────────────────────────────────────────────────
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Logging ──────────────────────────────────────────────────
logging.level.com.hospital=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=INFO
